name: PR Preview Release

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/**'
      - '.github/workflows/pr-release.yml'

permissions:
  contents: write
  pull-requests: write

jobs:
  pr-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set PR number
        id: pr
        run: echo "number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT

      - name: Prepare scripts with dev default and a ga preview
        run: |
          mkdir -p pr-scripts pr-scripts/ga

          # dev preview: from scripts/negative, with the internal options (what the PR preview has always been)
          cp scripts/negative/linux-installer.sh pr-scripts/linux-installer.sh
          cp scripts/negative/macos-installer.sh pr-scripts/macos-installer.sh
          cp scripts/negative/windows-installer.ps1 pr-scripts/windows-installer.ps1
          sed -i 's/^DEFAULT_ENV="[^"]*"/DEFAULT_ENV="dev"/' pr-scripts/linux-installer.sh pr-scripts/macos-installer.sh
          sed -i 's/\$Script:DefaultEnv = "[^"]*"/$Script:DefaultEnv = "dev"/' pr-scripts/windows-installer.ps1

          # ga preview: from scripts/positive, what a customer gets, without the internal options
          cp scripts/positive/linux-installer.sh pr-scripts/ga/linux-installer.sh
          cp scripts/positive/macos-installer.sh pr-scripts/ga/macos-installer.sh
          cp scripts/positive/windows-installer.ps1 pr-scripts/ga/windows-installer.ps1
          sed -i 's/^DEFAULT_ENV="[^"]*"/DEFAULT_ENV="ga"/' pr-scripts/ga/linux-installer.sh pr-scripts/ga/macos-installer.sh
          sed -i 's/\$Script:DefaultEnv = "[^"]*"/$Script:DefaultEnv = "ga"/' pr-scripts/ga/windows-installer.ps1

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Deploy to PR directory
        run: |
          mkdir -p gh-pages/pr
          cp pr-scripts/linux-installer.sh gh-pages/pr/
          cp pr-scripts/macos-installer.sh gh-pages/pr/
          cp pr-scripts/windows-installer.ps1 gh-pages/pr/
          mkdir -p gh-pages/pr/ga
          cp pr-scripts/ga/* gh-pages/pr/ga/
          
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pr/
          git commit -m "Deploy PR #${{ steps.pr.outputs.number }} preview scripts" || echo "No changes to commit"
          git push

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = ${{ steps.pr.outputs.number }};
            const repoUrl = 'https://outsystems.github.io/outsystems-selfhosted-provision';
            
            const comment = `## 🚀 PR Preview Scripts Available
            
            Your installer scripts are now available with **dev** as the default environment:
            
            - **Linux**: \`${repoUrl}/pr/linux-installer.sh\`
            - **macOS**: \`${repoUrl}/pr/macos-installer.sh\`
            - **Windows**: \`${repoUrl}/pr/windows-installer.ps1\`
            
            ### Quick Install:
            \`\`\`bash
            # Linux/macOS
            curl -fsSL ${repoUrl}/pr/linux-installer.sh | bash
            \`\`\`

            \`\`\`powershell
            # Windows
            irm ${repoUrl}/pr/windows-installer.ps1 | iex
            \`\`\`

            **Default Environment:** dev

            ### What a customer gets (ga build, without the internal options):
            - **Linux**: \`${repoUrl}/pr/ga/linux-installer.sh\`
            - **macOS**: \`${repoUrl}/pr/ga/macos-installer.sh\`
            - **Windows**: \`${repoUrl}/pr/ga/windows-installer.ps1\``;
            
            github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
